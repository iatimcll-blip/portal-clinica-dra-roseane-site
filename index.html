<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal de Desempenho | Dra. Roseane Debora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="login" class="login-view">
      <div class="photo-panel"></div>
      <section class="login-card">
        <div class="brand-mark text-logo login-logo">RD</div>
        <h1>Dra. Roseane Debora</h1>
        <p>Portal de desempenho</p>
        <form id="loginForm" class="login-form">
          <label>E-mail<input id="email" type="email" autocomplete="email" value="admin@clinica.com.br" required /></label>
          <label>Senha<input id="password" type="password" autocomplete="current-password" value="123456" required /></label>
          <button type="submit">Entrar no painel</button>
        </form>
        <div class="login-hint">
          <span>Admin: admin@clinica.com.br</span>
          <span>Profissional: kelly@clinica.com.br</span>
          <span>Senha demo: 123456</span>
        </div>
      </section>
    </main>

    <main id="app" class="app-shell is-hidden">
      <aside class="sidebar" aria-label="Menu lateral">
        <div class="sidebar-photo"></div>
        <div class="sidebar-overlay"></div>
        <div class="sidebar-content">
          <div class="brand-mark text-logo sidebar-logo">RD</div>
          <nav id="navMenu" class="menu"></nav>
        </div>
      </aside>

      <section class="workspace">
        <header class="navbar">
          <div class="nav-title">
            <div class="brand-mark text-logo nav-logo">RD</div>
            <span id="areaTitle">Meu painel</span>
          </div>
          <div class="nav-actions">
            <select id="monthSelect" aria-label="Selecionar mês"></select>
            <div id="avatar" class="avatar">DR</div>
            <button id="logoutBtn" class="icon-button" type="button" title="Sair">Sair</button>
          </div>
        </header>
        <div id="content" class="content"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
